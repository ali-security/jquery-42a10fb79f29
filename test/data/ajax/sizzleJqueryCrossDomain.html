<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<meta http-equiv="content-type" content="text/html; charset=utf-8">
<title>Bundled jQuery 1.9.1 (src/sizzle/test/jquery.js) does not execute cross-domain js (gh-2432)</title>
<script src="../../../src/sizzle/test/jquery.js"></script>
</head>
<body>
<script type="text/javascript">
var executed = 0,
	results = {},
	requests = [
		[ "crossDomainEcma", { data: { header: "ecma" }, crossDomain: true } ],
		[ "crossDomainJs", { data: { header: "js" }, crossDomain: true } ],
		[ "crossDomainNoHeader", { crossDomain: true } ],
		[ "crossDomainDataTypeScript", { data: { header: "ecma" }, crossDomain: true, dataType: "script" } ],
		[ "sameDomain", { data: { header: "ecma" } } ]
	];

// ../script.php responds with `ok( true, ... );`, so a call to ok() means the
// response was evaluated in this window
window.ok = function() {
	executed++;
};

function next() {
	var request = requests.shift();
	if ( !request ) {
		window.parent.iframeCallback( jQuery.fn.jquery, results );
		return;
	}
	executed = 0;
	jQuery.ajax( jQuery.extend( { url: "../script.php", cache: false }, request[ 1 ] ) ).always(function() {
		results[ request[ 0 ] ] = executed > 0;
		next();
	});
}

next();
</script>
</body>
</html>
